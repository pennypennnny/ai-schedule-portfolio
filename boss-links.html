const state = { q: '' };
const el = {
  grid: document.getElementById('grid'),
  count: document.getElementById('count'),
  q: document.getElementById('q'),
  bossAll: document.getElementById('bossAll')
};

function sizeOf(n){
  if (typeof n !== 'number' || !isFinite(n)) return null;
  return n >= 1000 ? '大' : n >= 300 ? '中' : '小';
}
function sizeBadge(n){
  const s = sizeOf(n);
  if (!s) return '<span class="badge b-na">规模未公开</span>';
  const cls = s === '大' ? 'b-lg' : s === '中' ? 'b-md' : 'b-sm';
  return '<span class="badge ' + cls + '">' + s + '型</span>';
}
function empText(n){
  if (typeof n !== 'number' || !isFinite(n)) return '员工数未公开';
  if (n >= 10000) return '约 ' + (n / 10000).toFixed(1).replace(/\.0$/, '') + ' 万人';
  return '约 ' + n + ' 人';
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = s => encodeURIComponent(String(s || ''));

function rows(){
  return DATA.filter(Boolean).sort((a, b) => (b.emp || 0) - (a.emp || 0));
}
function match(d){
  const q = state.q.trim().toLowerCase();
  if (!q) return true;
  return [d.n, d.sh, d.ind, d.dis, d.city, d.own].filter(Boolean).join(' ').toLowerCase().includes(q);
}
function card(d){
  return '<article class="card">' +
    '<div class="top"><div><div class="name">' + esc(d.n) + '</div>' +
      (d.sh ? '<div class="short">' + esc(d.sh) + '</div>' : '') + '</div></div>' +
    '<div class="badges">' + sizeBadge(d.emp) +
      (d.own ? '<span class="badge">' + esc(d.own) + '</span>' : '') +
      (d.remote ? '<span class="badge">可远程</span>' : (d.city ? '<span class="badge">异地 · ' + esc(d.city) + '</span>' : '')) +
    '</div>' +
    '<div class="meta"><b>' + esc(d.ind || '行业未核实') + '</b> · ' + esc(d.dis || '广州') + ' · ' + empText(d.emp) + '</div>' +
    '<div class="links">' +
      '<a class="lnk live" href="' + esc(d.boss) + '" target="_blank" rel="noopener noreferrer" title="需登录 BOSS 账号">BOSS 实时</a>' +
      (d.career ? '<a class="lnk" href="' + esc(d.career) + '" target="_blank" rel="noopener noreferrer">官方招聘页</a>' : '') +
      (d.site ? '<a class="lnk" href="' + esc(d.site) + '" target="_blank" rel="noopener noreferrer">官网</a>' : '') +
    '</div>' +
  '</article>';
}
function render(){
  const list = rows().filter(match);
  const all = rows().length;
  el.count.innerHTML = '当前列出 <b>' + list.length + '</b> 家' + (list.length !== all ? '（已筛选，共 ' + all + ' 家）' : '') +
    ' · 卡片右下角即该公司的 BOSS 实时搜索';
  el.grid.innerHTML = list.length ? list.map(card).join('') : '<div class="empty">没有匹配的公司，换个关键词试试。</div>';
}
el.q.addEventListener('input', e => { state.q = e.target.value; render(); });
render();

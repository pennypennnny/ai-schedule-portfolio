<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>广州公司索引</title>
<style>
  :root{
    --ink:#0f172a;
    --ink-2:#334155;
    --muted:#64748b;
    --line:#e2e8f0;
    --bg:#f4f6fa;
    --card:#ffffff;
    --me:#4f46e5;
    --me-soft:#eeefff;
    --him:#ea580c;
    --him-soft:#fff3ea;
    --ok:#059669;
    --warn:#b45309;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}

  /* ---------- Hero ---------- */
  .hero{
    background:linear-gradient(160deg,#0b1f3a 0%,#14355c 45%,#1d4b7c 100%);
    color:#fff;
    padding:38px 20px 84px;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute;width:520px;height:520px;right:-140px;top:-220px;
    background:radial-gradient(circle,rgba(99,179,237,.28),transparent 68%);
    pointer-events:none;
  }
  .hero::before{
    content:"";
    position:absolute;width:380px;height:380px;left:-120px;bottom:-200px;
    background:radial-gradient(circle,rgba(234,88,12,.22),transparent 70%);
    pointer-events:none;
  }
  .wrap{max-width:1220px;margin:0 auto;position:relative;}
  .eyebrow{
    margin:0 0 10px;font-size:12px;letter-spacing:.18em;
    text-transform:uppercase;color:rgba(255,255,255,.62);
  }
  .hero h1{
    margin:0;font-size:32px;line-height:1.25;font-weight:700;letter-spacing:-.5px;
  }
  .hero h1 span{color:#93c5fd;}
  .hero .sub{
    margin:10px 0 0;max-width:660px;color:rgba(255,255,255,.76);font-size:14px;
  }
  .hero .stamp{
    margin-top:16px;display:inline-flex;align-items:center;gap:8px;
    font-size:12px;color:rgba(255,255,255,.62);
  }
  .dot{width:6px;height:6px;border-radius:50%;background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.18);}

  /* ---------- Tabs ---------- */
  .tabs{
    display:inline-flex;gap:4px;margin-top:22px;padding:4px;
    background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);
    border-radius:999px;backdrop-filter:blur(6px);
  }
  .tab{
    border:0;background:transparent;color:rgba(255,255,255,.78);
    padding:9px 20px;border-radius:999px;font-size:13.5px;font-weight:600;
    transition:all .18s ease;
  }
  .tab b{font-weight:700;}
  .tab.active{background:#fff;color:#0b1f3a;box-shadow:0 2px 10px rgba(0,0,0,.14);}
  .tab.active .who-me{color:var(--me);}
  .tab.active .who-him{color:var(--him);}

  /* ---------- Layout ---------- */
  main{position:relative;z-index:1;max-width:1220px;margin:-56px auto 0;padding:0 20px 64px;}

  .panel{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px 20px;box-shadow:0 10px 30px rgba(15,23,42,.06);
  }
  .profile{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;}
  .profile-avatar{
    width:52px;height:52px;border-radius:14px;flex:none;
    display:grid;place-items:center;font-size:22px;
  }
  .profile.me .profile-avatar{background:var(--me-soft);color:var(--me);}
  .profile.him .profile-avatar{background:var(--him-soft);color:var(--him);}
  .profile-body{flex:1;min-width:260px;}
  .profile-body h2{margin:0 0 6px;font-size:17px;}
  .profile-body p{margin:0;color:var(--muted);font-size:13.5px;}
  .profile-body p strong{color:var(--ink-2);}
  .tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .tag{
    font-size:12px;padding:3px 9px;border-radius:999px;
    background:#f1f5f9;color:#475569;border:1px solid #e8eef5;
  }
  .profile.me .tag{background:#f5f4ff;border-color:#e6e4ff;color:#4c47b8;}
  .profile.him .tag{background:#fff6ef;border-color:#ffe6d3;color:#b45309;}

  /* ---------- Stats ---------- */
  .stats{
    display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px;
  }
  .stat{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;
  }
  .stat .k{font-size:12px;color:var(--muted);}
  .stat .v{font-size:24px;font-weight:750;letter-spacing:-.5px;margin-top:2px;}
  .stat .v small{font-size:12px;font-weight:500;color:var(--muted);margin-left:4px;letter-spacing:0;}

  /* ---------- Toolbar ---------- */
  .toolbar{
    position:sticky;top:0;z-index:20;
    background:rgba(244,246,250,.92);backdrop-filter:blur(10px);
    padding:14px 0 10px;margin-top:18px;
    border-bottom:1px solid transparent;
  }
  .toolbar.stuck{border-bottom-color:var(--line);}
  .tb-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .search{
    flex:1 1 260px;min-width:220px;position:relative;
  }
  .search input{
    width:100%;padding:10px 12px 10px 34px;border-radius:10px;
    border:1px solid var(--line);background:#fff;font-size:13.5px;color:var(--ink);
    outline:none;transition:border-color .15s, box-shadow .15s;
  }
  .search input:focus{border-color:#93b4f5;box-shadow:0 0 0 3px rgba(79,70,229,.10);}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.42;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .chips .lbl{font-size:12px;color:var(--muted);margin-right:2px;}
  .chip{
    border:1px solid var(--line);background:#fff;color:var(--ink-2);
    padding:6px 12px;border-radius:999px;font-size:12.5px;transition:all .15s;
  }
  .chip:hover{border-color:#cbd5e1;}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .chip .n{opacity:.55;margin-left:4px;font-size:11px;}
  select.sel{
    border:1px solid var(--line);background:#fff;border-radius:10px;
    padding:8px 10px;font-size:13px;color:var(--ink-2);outline:none;
  }
  .switch{
    display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);
    border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;
  }
  .switch input{accent-color:var(--me);margin:0;}
  .boss-go{
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
    background:#047857;border:1px solid #047857;color:#fff;border-radius:10px;
    padding:9px 13px;font-size:13px;font-weight:600;text-decoration:none;
    transition:background .15s,border-color .15s,transform .15s;
  }
  .boss-go:hover{background:#065f46;border-color:#065f46;transform:translateY(-1px);}
  .boss-go .b-dot{width:6px;height:6px;border-radius:50%;background:#6ee7b7;}
  .shixi-go{background:#0f766e;border-color:#0f766e;}
  .shixi-go:hover{background:#115e59;border-color:#115e59;}
  .shixi-go .b-dot{background:#99f6e4;}
  .result-line{
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    margin:16px 2px 10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;
  }
  .result-line b{color:var(--ink);font-size:14px;}

  /* ---------- Cards ---------- */
  .grid{
    display:grid;gap:12px;
    grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  }
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:15px 16px 13px;display:flex;flex-direction:column;gap:9px;
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    position:relative;
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(15,23,42,.09);border-color:#cbd5e1;}
  .card-top{display:flex;align-items:flex-start;gap:8px;}
  .c-name{
    font-size:15.5px;font-weight:700;letter-spacing:-.2px;line-height:1.35;flex:1;min-width:0;
  }
  .c-code{
    font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;
    padding:1px 5px;font-weight:500;white-space:nowrap;margin-top:2px;
  }
  .badges{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
  .badge{
    font-size:11px;padding:2px 7px;border-radius:6px;font-weight:650;letter-spacing:.02em;
  }
  .b-lg{background:#e8effc;color:#1d4b7c;}
  .b-md{background:#fef3c7;color:#92400e;}
  .b-sm{background:#e6f6ef;color:#0f6b4f;}
  .b-na{background:#f1f5f9;color:#64748b;}
  .b-own{background:#fff;border:1px solid var(--line);color:var(--muted);font-weight:500;}
  .hiring-yes{background:#e7f7ef;color:#047857;}
  .hiring-todo{background:#f1f5f9;color:#64748b;}
  .b-away{background:#eef2ff;color:#4338ca;}

  .c-meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:0 10px;}
  .c-meta i{font-style:normal;color:#94a3b8;}
  .c-role{
    font-size:13px;color:var(--ink-2);background:#f8fafc;border:1px solid #eef2f7;
    border-radius:9px;padding:8px 10px;
  }
  .c-role b{font-weight:650;color:var(--ink);}
  .c-note{font-size:12px;color:#94a3b8;line-height:1.5;}
  .c-foot{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin-top:auto;padding-top:4px;flex-wrap:wrap;
  }
  .stars{font-size:12.5px;color:#f59e0b;letter-spacing:1px;white-space:nowrap;}
  .stars em{font-style:normal;color:#cbd5e1;}
  .stars .n{color:var(--muted);font-size:11px;margin-left:4px;letter-spacing:0;}
  .links{display:flex;gap:5px;flex-wrap:wrap;}
  .lnk{
    font-size:11.5px;padding:4px 8px;border-radius:7px;border:1px solid var(--line);
    color:#475569;background:#fff;transition:all .14s;white-space:nowrap;
  }
  .lnk:hover{background:#0f172a;border-color:#0f172a;color:#fff;}
  .lnk.primary{border-color:#bfd4ff;background:#f2f7ff;color:#1d4b7c;}
  .lnk.primary:hover{background:#1d4b7c;border-color:#1d4b7c;color:#fff;}
  .lnk.live{border-color:#bfe9d3;background:#f1fbf6;color:#047857;font-weight:600;}
  .lnk.live:hover{background:#047857;border-color:#047857;color:#fff;}

  .empty{
    grid-column:1/-1;text-align:center;padding:56px 20px;color:var(--muted);
    background:#fff;border:1px dashed var(--line);border-radius:var(--radius);
  }
  .empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:6px;}

  /* ---------- Advice / Notes ---------- */
  .section-title{
    display:flex;align-items:center;gap:9px;margin:30px 0 12px;font-size:16px;font-weight:700;
  }
  .section-title::before{
    content:"";width:4px;height:16px;border-radius:2px;
    background:linear-gradient(180deg,var(--me),var(--him));
  }
  .advice{
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 20px;
  }
  .advice ol{margin:12px 0;padding-left:22px;}
  .advice li{margin:9px 0;font-size:13.5px;color:var(--ink-2);}
  .advice li b{color:var(--ink);}

  .channels{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px;
  }
  .ch{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;
  }
  .ch-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:14px;font-weight:700;}
  .ch-n{
    font-size:11px;font-weight:700;color:var(--him);background:var(--him-soft);
    border-radius:6px;padding:1px 6px;letter-spacing:.04em;
  }
  .ch p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.65;}
  .ch-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
  .ch-links a{
    font-size:11.5px;border:1px solid var(--line);border-radius:7px;padding:3px 8px;
    color:#475569;background:#fff;transition:all .14s;
  }
  .ch-links a:hover{background:#0f172a;border-color:#0f172a;color:#fff;}

  .notes{
    margin-top:14px;background:#fbfcfe;border:1px solid var(--line);border-radius:16px;
    padding:18px 20px;
  }
  .notes h3{margin:0 0 10px;font-size:14px;}
  .notes ul{margin:0;padding-left:18px;}
  .notes li{font-size:12.5px;color:var(--muted);margin:7px 0;line-height:1.65;}
  .notes li b{color:var(--ink-2);}
  footer{
    text-align:center;color:#94a3b8;font-size:12px;padding:26px 20px 40px;
  }

  @media (max-width:760px){
    .hero{padding:30px 18px 76px;}
    .hero h1{font-size:25px;}
    main{padding:0 14px 48px;margin-top:-52px;}
    .stats{grid-template-columns:repeat(2,1fr);}
    .profile{padding:16px;}
    .grid{grid-template-columns:1fr;}
    .toolbar{position:static;padding-top:8px;}
    .tb-row{gap:8px;}
    .hero .stamp{font-size:11px;}
    .tab{padding:8px 14px;font-size:13px;}
  }
  @media print{
    .toolbar,.tabs,.hero::before,.hero::after{display:none;}
    .card{break-inside:avoid;}
  }
</style>
</head>

/* ---------------- 逻辑 ---------------- */
const state = { q:'', size:'all', own:'all', ind:'all', sort:'emp' };

/* ---------------- 工具函数 ---------------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = s => encodeURIComponent(String(s || ''));

function sizeOf(n){
  if (typeof n !== 'number' || !isFinite(n)) return null;
  return n >= 1000 ? '大' : n >= 300 ? '中' : '小';
}
function sizeBadge(n){
  const s = sizeOf(n);
  if (!s) return '<span class="badge b-na">规模未核实</span>';
  const cls = s === '大' ? 'b-lg' : s === '中' ? 'b-md' : 'b-sm';
  return '<span class="badge ' + cls + '">' + s + '型</span>';
}
function empText(n){
  if (typeof n !== 'number' || !isFinite(n)) return '员工数未核实';
  if (n >= 10000) return '约 ' + (n / 10000).toFixed(1).replace(/\.0$/, '') + ' 万人';
  return '约 ' + n + ' 人';
}

/* 自动拼接的实时搜索链接：不依赖公司官网，永远能点 */
function searchLinks(d){
  const q = enc(d.name);
  const boss = d.boss || ('https://www.zhipin.com/web/geek/job?query=' + q + '&city=101280100');
  return [
    { t:'BOSS 实时', u:boss, cls:'live', tip:'需登录 BOSS 账号；未登录会先跳登录页' },
    { t:'百度', u:'https://www.baidu.com/s?wd=' + q + '+广州' }
  ];
}

/* ---------------- 主渲染 ---------------- */
const el = {
  stats: document.getElementById('stats'),
  grid: document.getElementById('grid'),
  resultLine: document.getElementById('resultLine'),
  q: document.getElementById('q'),
  ind: document.getElementById('ind'),
  sort: document.getElementById('sort'),
  sizeChips: document.getElementById('sizeChips'),
  ownChips: document.getElementById('ownChips'),
  toolbar: document.getElementById('toolbar'),
  bossGo: document.getElementById('bossGo')
};

function allRows(){
  return DATA.filter(Boolean);
}

function applyFilters(rows){
  const q = state.q.trim().toLowerCase();
  return rows.filter(d => {
    if (state.own !== 'all' && d.ownership !== state.own) return false;
    if (state.ind !== 'all' && d.industry !== state.ind) return false;
    if (state.size !== 'all' && sizeOf(d.employees) !== state.size) return false;
    if (q) {
      const hay = [d.name, d.short, d.code, d.industry, d.district, d.city, d.ownership]
        .filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function sortRows(rows){
  const list = rows.slice();
  if (state.sort === 'emp') {
    list.sort((a, b) => (b.employees || 0) - (a.employees || 0));
  } else {
    list.sort((a, b) => String(a.name).localeCompare(String(b.name), 'zh-CN'));
  }
  return list;
}

function renderStats(rows){
  const n = rows.length;
  const big = rows.filter(d => sizeOf(d.employees) === '大').length;
  const mid = rows.filter(d => sizeOf(d.employees) === '中').length;
  const small = rows.filter(d => sizeOf(d.employees) === '小').length;
  const unknown = n - big - mid - small;
  const cards = [
    ['当前列出', n, '家', '全表收录 ' + DATA.length + ' 家'],
    ['大型（≥1000人）', big, '家', '中型 ' + mid + ' · 小型 ' + small],
    ['中型（300-999人）', mid, '家', '大型 ' + big + ' · 小型 ' + small],
    ['小型（&lt;300人）', small, '家', '规模未核实 ' + unknown + ' 家']
  ];
  el.stats.innerHTML = cards.map(c =>
    '<div class="stat"><div class="k">' + c[0] + '</div>' +
    '<div class="v">' + c[1] + (c[2] ? '<small>' + c[2] + '</small>' : '') + '</div>' +
    '<div class="k" style="margin-top:2px;font-size:11.5px;">' + c[3] + '</div></div>'
  ).join('');
}

function renderIndustryOptions(){
  const set = [...new Set(allRows().map(d => d.industry).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN'));
  const keep = state.ind;
  el.ind.innerHTML = '<option value="all">全部行业</option>' +
    set.map(v => '<option value="' + esc(v) + '">' + esc(v) + '</option>').join('');
  el.ind.value = set.includes(keep) ? keep : 'all';
  if (!set.includes(keep)) state.ind = 'all';
}

function cardHTML(d){
  const site = d.site ? '<a class="lnk primary" href="' + esc(d.site) + '" target="_blank" rel="noopener noreferrer">官网</a>' : '';
  const career = d.career ? '<a class="lnk" href="' + esc(d.career) + '" target="_blank" rel="noopener noreferrer">招聘页</a>' : '';
  const auto = searchLinks(d).map(l =>
    '<a class="lnk' + (l.cls ? ' ' + l.cls : '') + '" href="' + esc(l.u) + '" target="_blank" rel="noopener noreferrer"' +
    (l.tip ? ' title="' + esc(l.tip) + '"' : '') + '>' + l.t + '</a>'
  ).join('');
  return '<article class="card">' +
    '<div class="card-top">' +
      '<div class="c-name">' + esc(d.name) + (d.short ? '<div style="font-weight:500;color:#94a3b8;font-size:12px;margin-top:1px;">' + esc(d.short) + '</div>' : '') + '</div>' +
      (d.code ? '<span class="c-code">' + esc(d.code) + '</span>' : '') +
    '</div>' +
    '<div class="badges">' + sizeBadge(d.employees) +
      '<span class="badge b-own">' + esc(d.ownership || '性质未核实') + '</span>' +
      (d.remote ? '<span class="badge b-away">可远程</span>' : (d.city ? '<span class="badge b-away">异地 · ' + esc(d.city) + '</span>' : '')) +
    '</div>' +
    '<div class="c-meta">' +
      '<span><i>行业</i> ' + esc(d.industry || '未核实') + '</span>' +
      '<span><i>地点</i> ' + esc(d.district || '广州') + '</span>' +
      '<span><i>规模</i> ' + empText(d.employees) + '</span>' +
    '</div>' +
    '<div class="c-foot"><div class="links">' + site + career + auto + '</div></div>' +
  '</article>';
}

function render(){
  renderIndustryOptions();
  const filtered = sortRows(applyFilters(allRows()));
  renderStats(filtered);
  const total = allRows().length;
  const kw = state.q.trim();
  el.bossGo.href = 'https://www.zhipin.com/web/geek/job?city=101280100' + (kw ? '&query=' + enc(kw) : '');
  el.bossGo.innerHTML = '<span class="b-dot"></span>BOSS 实时' + (kw ? ' · ' + esc(kw) : ' · 广州');
  el.resultLine.innerHTML =
    '<div>共 <b>' + filtered.length + '</b> 家' + (filtered.length !== total ? '（已筛选，全表 ' + total + ' 家）' : '') + '</div>' +
    '<div>' + (state.sort === 'emp' ? '按员工人数排序' : '按公司名排序') + '</div>';
  el.grid.innerHTML = filtered.length
    ? filtered.map(cardHTML).join('')
    : '<div class="empty"><b>没有符合条件的公司</b>试试放宽筛选条件，或清空搜索关键词。</div>';
}

/* ---------------- 事件 ---------------- */
el.q.addEventListener('input', e => { state.q = e.target.value; render(); });
el.sort.addEventListener('change', e => { state.sort = e.target.value; render(); });
el.ind.addEventListener('change', e => { state.ind = e.target.value; render(); });

el.sizeChips.addEventListener('click', e => {
  const b = e.target.closest('[data-size]'); if (!b) return;
  state.size = b.dataset.size;
  [...el.sizeChips.querySelectorAll('[data-size]')].forEach(x => x.classList.toggle('on', x === b));
  render();
});
el.ownChips.addEventListener('click', e => {
  const b = e.target.closest('[data-own]'); if (!b) return;
  state.own = b.dataset.own;
  [...el.ownChips.querySelectorAll('[data-own]')].forEach(x => x.classList.toggle('on', x === b));
  render();
});

// sticky 工具栏加阴影
window.addEventListener('scroll', () => {
  el.toolbar.classList.toggle('stuck', el.toolbar.getBoundingClientRect().top <= 0);
}, { passive:true });

render();
</script>
</body>
</html>
